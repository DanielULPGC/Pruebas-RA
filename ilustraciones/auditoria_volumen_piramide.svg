<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Volumen de pirámide cuadrangular · ejemplo matemático actual</title><desc id="descripcion">Pirámide cuadrangular matemática con altura perpendicular al centro de la base. Ejemplo escolar: lado 6 metros y altura 4 metros; área de base 36 metros cuadrados y volumen 48 metros cúbicos. No se representa a escala y no se afirma que sea un monumento concreto.</desc>
<defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#FCF4E4"/><stop offset="1" stop-color="#E3F4F6"/></linearGradient></defs>
<rect width="1200" height="760" rx="24" fill="url(#bg)"/>
<path d="M52 122H1148" stroke="#C5A675" stroke-width="2"/>
<text x="54" y="69" fill="#153E50" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="35">Cómo calcular el volumen de una pirámide</text>
<text x="54" y="106" fill="#425F6C" font-family="DejaVu Sans, sans-serif" font-size="19">Ejemplo escolar actual · La figura es esquemática y no está a escala</text>
<rect x="54" y="155" width="770" height="510" rx="16" fill="#FFFFFF" stroke="#C8DADB" stroke-width="2"/><path d="M260 450L600 450L720 520L380 520Z" fill="#E7BB83" stroke="#865F45" stroke-width="3"/><path d="M490 155 L260 450 L380 520Z" fill="#F6CB8B" stroke="#845D3F" stroke-width="3"/><path d="M490 155 L380 520 L720 520Z" fill="#C99060" stroke="#845D3F" stroke-width="3"/><path d="M490 155 L720 520 L600 450" fill="none" stroke="#865F45" stroke-width="3" stroke-dasharray="11 9"/><path d="M260 450L600 450L720 520" fill="none" stroke="#906B48" stroke-width="3" stroke-dasharray="9 8"/><path d="M490 155 L490 485" fill="none" stroke="#0B6786" stroke-width="5" stroke-dasharray="12 8"/><circle cx="490" cy="485" r="7" fill="#0B6786" stroke="white" stroke-width="2"/><text x="502" y="295" font-size="30" fill="#064863" font-weight="bold" font-family="DejaVu Sans,sans-serif">h = 4 m</text><rect x="844" y="155" width="300" height="510" rx="16" fill="#FFFFFF" stroke="#C8DADB" stroke-width="2"/><text x="865" y="205" font-size="24" fill="#20495E" font-weight="bold" font-family="DejaVu Sans,sans-serif">Datos escolares</text><text x="865" y="260" font-size="20" fill="#20495E" font-weight="normal" font-family="DejaVu Sans,sans-serif">Base cuadrada:</text><text x="873" y="299" font-size="27" fill="#20495E" font-weight="bold" font-family="DejaVu Sans,sans-serif">a = 6 m</text><text x="865" y="351" font-size="20" fill="#20495E" font-weight="normal" font-family="DejaVu Sans,sans-serif">Altura interior:</text><text x="873" y="390" font-size="27" fill="#20495E" font-weight="bold" font-family="DejaVu Sans,sans-serif">h = 4 m</text><text x="865" y="446" font-size="22" fill="#20495E" font-weight="bold" font-family="DejaVu Sans,sans-serif">V = a² × h ÷ 3</text><text x="865" y="488" font-size="20" fill="#20495E" font-weight="normal" font-family="DejaVu Sans,sans-serif">V = 36 × 4 ÷ 3</text><text x="865" y="532" font-size="29" fill="#075A73" font-weight="bold" font-family="DejaVu Sans,sans-serif">V = 48 m³</text><text x="506" y="490" font-size="20" fill="#20495E" font-weight="bold" font-family="DejaVu Sans,sans-serif">O</text><g id="cota-base" stroke="#064863" stroke-width="2" fill="none"><path d="M380 529V565 M720 529V565 M380 550H720 M375 545L385 555 M715 545L725 555"/></g><text x="550" y="590" text-anchor="middle" font-size="27" fill="#064863" font-weight="bold" font-family="DejaVu Sans,sans-serif">a = 6 m</text><text x="150" y="623" font-size="17" fill="#20495E" font-weight="normal" font-family="DejaVu Sans,sans-serif">La altura h es perpendicular al plano de la base y termina en O.</text>
<text x="54" y="718" fill="#4A6069" font-family="DejaVu Sans,sans-serif" font-size="18">Fórmula válida para pirámides: V = área de la base × altura perpendicular ÷ 3</text>
</svg>