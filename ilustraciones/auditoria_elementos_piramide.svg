<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Elementos de una pirámide de base cuadrada · esquema matemático</title><desc id="descripcion">Esquema actual en perspectiva de una pirámide de base cuadrada, con cinco caras, ocho aristas, cinco vértices y altura interior desde el vértice al centro de la base. Sin escala métrica.</desc>
<defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#FCF4E4"/><stop offset="1" stop-color="#E3F4F6"/></linearGradient></defs>
<rect width="1200" height="760" rx="24" fill="url(#bg)"/>
<path d="M52 122H1148" stroke="#C5A675" stroke-width="2"/>
<text x="54" y="69" fill="#153E50" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="35">Partes de una pirámide de base cuadrada</text>
<text x="54" y="106" fill="#425F6C" font-family="DejaVu Sans, sans-serif" font-size="19">Esquema matemático actual · Identificar antes de medir</text>
<rect x="54" y="155" width="770" height="510" rx="16" fill="#FFFFFF" stroke="#C8DADB" stroke-width="2"/><path d="M260 450L600 450L720 520L380 520Z" fill="#E7BB83" stroke="#865F45" stroke-width="3"/><path d="M490 155 L260 450 L380 520Z" fill="#F6CB8B" stroke="#845D3F" stroke-width="3"/><path d="M490 155 L380 520 L720 520Z" fill="#C99060" stroke="#845D3F" stroke-width="3"/><path d="M490 155 L720 520 L600 450" fill="none" stroke="#865F45" stroke-width="3" stroke-dasharray="11 9"/><path d="M260 450L600 450L720 520" fill="none" stroke="#906B48" stroke-width="3" stroke-dasharray="9 8"/><path d="M490 155 L490 485" fill="none" stroke="#0B6786" stroke-width="5" stroke-dasharray="12 8"/><circle cx="490" cy="485" r="7" fill="#0B6786" stroke="white" stroke-width="2"/><text x="502" y="295" font-size="30" fill="#064863" font-weight="bold" font-family="DejaVu Sans,sans-serif">h</text><rect x="844" y="155" width="300" height="510" rx="16" fill="#FFFFFF" stroke="#C8DADB" stroke-width="2"/><text x="868" y="202" font-size="27" fill="#20495E" font-weight="bold" font-family="DejaVu Sans,sans-serif">Elementos</text><text x="868" y="255" font-size="21" fill="#20495E" font-weight="normal" font-family="DejaVu Sans,sans-serif">5 caras:</text><text x="876" y="284" font-size="19" fill="#20495E" font-weight="normal" font-family="DejaVu Sans,sans-serif">1 base cuadrada +</text><text x="876" y="311" font-size="19" fill="#20495E" font-weight="normal" font-family="DejaVu Sans,sans-serif">4 caras triangulares</text><text x="868" y="365" font-size="23" fill="#20495E" font-weight="bold" font-family="DejaVu Sans,sans-serif">8 aristas</text><text x="868" y="412" font-size="23" fill="#20495E" font-weight="bold" font-family="DejaVu Sans,sans-serif">5 vértices</text><text x="868" y="464" font-size="22" fill="#20495E" font-weight="bold" font-family="DejaVu Sans,sans-serif">h: altura</text><text x="868" y="495" font-size="19" fill="#20495E" font-weight="normal" font-family="DejaVu Sans,sans-serif">perpendicular a</text><text x="868" y="522" font-size="19" fill="#20495E" font-weight="normal" font-family="DejaVu Sans,sans-serif">la base; termina</text><text x="868" y="549" font-size="19" fill="#20495E" font-weight="normal" font-family="DejaVu Sans,sans-serif">en el centro O.</text><text x="490" y="573" font-size="20" fill="#20495E" font-weight="bold" font-family="DejaVu Sans,sans-serif">O</text><text x="160" y="629" font-size="16" fill="#20495E" font-weight="normal" font-family="DejaVu Sans,sans-serif">Vista en perspectiva: las longitudes no se pueden medir en el dibujo.</text>
<text x="54" y="718" fill="#4A6069" font-family="DejaVu Sans,sans-serif" font-size="18">Ilustración geométrica actual · NO es la Gran Pirámide de Guiza · No está a escala</text>
</svg>