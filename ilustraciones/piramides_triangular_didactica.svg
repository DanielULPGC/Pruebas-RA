<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Pirámide triangular: esquema matemático moderno</title>
<desc id="descripcion">Una base triangular y tres caras laterales triangulares. La altura h une el vértice con su proyección perpendicular sobre el plano de la base. Las aristas ocultas y la altura interior se muestran por transparencia con trazos discontinuos. No reproduce el papiro ni está a escala métrica. Coordenadas derivadas del modelo GLB del proyecto.</desc>
<defs><linearGradient id="fondo" x2="1" y2="1"><stop stop-color="#FFF8EA"/><stop offset="1" stop-color="#E6F3F3"/></linearGradient></defs>
<rect width="960" height="600" rx="28" fill="url(#fondo)"/>
<text x="48" y="53" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="800" fill="#153F53">PIRÁMIDE TRIANGULAR</text>
<path d="M48 70H912" stroke="#C7B398" stroke-width="2"/>
<polygon points="480.00,108.00 377.00,308.20 420.00,457.25" fill="#E7B773" stroke="#835B3D" stroke-width="4" stroke-linejoin="round"/>
<polygon points="480.00,108.00 420.00,457.25 647.00,369.40" fill="#C68B57" stroke="#835B3D" stroke-width="4" stroke-linejoin="round"/>
<path id="aristas-ocultas" d="M377.00,308.20 L647.00,369.40" fill="none" stroke="#4E514D" stroke-width="3" stroke-dasharray="8 8"/>
<path id="altura" d="M480.00,108.00 L480.00,380.00" fill="none" stroke="#064E68" stroke-width="5" stroke-dasharray="10 8"/>
<circle id="pie-altura" cx="480.00" cy="380.00" r="7" fill="#064E68" stroke="#FFF" stroke-width="2"/>
<text x="498.00" y="244.00" font-family="DejaVu Sans,sans-serif" font-size="32" font-weight="800" fill="#064E68">h</text>
<rect x="690" y="190" width="220" height="106" rx="12" fill="#FFF" stroke="#9BBCC2" stroke-width="2"/>
<text x="706" y="225" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#15495C">Altura interior</text>
<text x="706" y="263" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#15495C">perpendicular</text>
<text x="48" y="520" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#254A59">4 caras · 6 aristas · 4 vértices · base triangular</text>
<text x="48" y="563" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#254A59">Esquema moderno · sin escala métrica · no reproduce el papiro</text>
</svg>
