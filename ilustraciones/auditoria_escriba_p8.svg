<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Problema 8 de un papiro matemático: ficha documental y cubo moderno</title><desc id="descripcion">Ficha textual del problema 8 del papiro MPER NS 1.1, según Kelly: un cubo de arista 6 pies en un dibujo deteriorado. A la derecha operación escolar moderna seis al cubo igual a 216 pies cúbicos. No es un dibujo antiguo.</desc>
<defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#FCF4E4"/><stop offset="1" stop-color="#E3F4F6"/></linearGradient></defs>
<rect width="1200" height="760" rx="24" fill="url(#bg)"/>
<path d="M52 122H1148" stroke="#C5A675" stroke-width="2"/>
<text x="54" y="69" fill="#153E50" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="35">El taller del escriba: un cubo de seis pies</text>
<text x="54" y="106" fill="#425F6C" font-family="DejaVu Sans, sans-serif" font-size="19">La geometría escolar permite interpretar un dibujo que no está a escala</text>
<rect x="52" y="160" width="510" height="486" rx="16" fill="#FFF9ED" stroke="#C7A273" stroke-width="2"/><text x="83" y="213" font-size="23" fill="#674A30" font-weight="bold" font-family="DejaVu Sans,sans-serif">TESTIMONIO DOCUMENTADO</text><text x="84" y="268" font-size="21" fill="#20495E" font-weight="normal" font-family="DejaVu Sans,sans-serif">MPER N.S. 1.1 · problema 8</text><text x="84" y="319" font-size="21" fill="#20495E" font-weight="normal" font-family="DejaVu Sans,sans-serif">Kelly (2026), figura A.2</text><text x="84" y="361" font-size="21" fill="#20495E" font-weight="normal" font-family="DejaVu Sans,sans-serif">Cubo con una arista</text><text x="84" y="394" font-size="21" fill="#20495E" font-weight="normal" font-family="DejaVu Sans,sans-serif">de 6 pies.</text><text x="84" y="452" font-size="20" fill="#20495E" font-weight="normal" font-family="DejaVu Sans,sans-serif">Parte del dibujo está</text><text x="84" y="483" font-size="20" fill="#20495E" font-weight="normal" font-family="DejaVu Sans,sans-serif">deteriorada.</text><text x="84" y="554" font-size="18" fill="#9A542A" font-weight="normal" font-family="DejaVu Sans,sans-serif">Esta ficha NO es una imagen</text><text x="84" y="582" font-size="18" fill="#9A542A" font-weight="normal" font-family="DejaVu Sans,sans-serif">ni edición del papiro.</text><rect x="588" y="160" width="560" height="486" rx="16" fill="#EAF8FA" stroke="#A3C9D3" stroke-width="2"/><text x="617" y="213" font-size="23" fill="#164B63" font-weight="bold" font-family="DejaVu Sans,sans-serif">OPERACIÓN ESCOLAR ACTUAL</text><text x="635" y="337" font-size="44" fill="#20495E" font-weight="bold" font-family="DejaVu Sans,sans-serif">6 × 6 × 6</text><text x="748" y="407" font-size="42" fill="#20495E" font-weight="bold" font-family="DejaVu Sans,sans-serif">=</text><text x="713" y="494" font-size="39" fill="#096F85" font-weight="bold" font-family="DejaVu Sans,sans-serif">216 pies³</text><text x="611" y="578" font-size="17" fill="#20495E" font-weight="normal" font-family="DejaVu Sans,sans-serif">Cálculo actual, no transcripción</text><text x="611" y="607" font-size="17" fill="#20495E" font-weight="normal" font-family="DejaVu Sans,sans-serif">del procedimiento antiguo.</text>
<text x="54" y="718" fill="#4A6069" font-family="DejaVu Sans,sans-serif" font-size="18">Referencia: Kelly (2026), Historia Mathematica 75, 103248, figura A.2 · Sin facsímil simulado</text>
</svg>