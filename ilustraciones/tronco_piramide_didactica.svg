<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title description">
<title id="title">Tronco de pirámide cuadrangular recta: dos bases paralelas</title>
<desc id="description">Ilustración matemática moderna derivada de las dimensiones relativas del modelo tridimensional del proyecto. Ocho vértices, doce aristas y seis caras: dos cuadrados paralelos y cuatro trapecios laterales. Una línea azul discontinua une los centros de las bases y representa la altura perpendicular; se dibuja sobre el sólido como convención explicativa. No hay escala métrica ni dimensiones históricas.</desc>
<defs><linearGradient id="background" x2="1" y2="1"><stop stop-color="#FFF8EA"/><stop offset="1" stop-color="#E6F3F3"/></linearGradient></defs>
<rect width="960" height="600" rx="28" fill="url(#background)"/>
<text x="48" y="53" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="800" fill="#153F53">TRONCO DE PIRÁMIDE · ESQUEMA MATEMÁTICO</text>
<path d="M48 70H912" stroke="#C7B398" stroke-width="2"/>
<ellipse cx="480" cy="493" rx="235" ry="25" fill="#1D5265" opacity=".12"/>
<!-- Cara inferior (no visible): las dos aristas ocultas se representan discontinuas. -->
<path d="M221.0,384.5 L424.0,240.3 L739.0,335.5" fill="none" stroke="#687C7E" stroke-width="3" stroke-dasharray="8 8"/>
<!-- Caras laterales: cada cuadrilátero tiene bordes proyectados desde vértices 3D reales. -->
<polygon points="357.9,167.6 506.4,212.4 536.0,479.7 221.0,384.5" fill="#E7B773" stroke="#835B3D" stroke-width="3.5" stroke-linejoin="round"/>
<polygon points="506.4,212.4 602.1,144.4 739.0,335.5 536.0,479.7" fill="#C68B57" stroke="#835B3D" stroke-width="3.5" stroke-linejoin="round"/>
<!-- Cara superior: cuadrados en dos planos horizontales paralelos. -->
<polygon points="453.6,99.6 602.1,144.4 506.4,212.4 357.9,167.6" fill="#F6D9A5" stroke="#835B3D" stroke-width="4" stroke-linejoin="round"/>
<!-- Altura interior, proyectada desde los centros geométricos: no desde una esquina. -->
<path d="M480.0,156.0 L480.0,360.0" fill="none" stroke="#0E6481" stroke-width="5" stroke-dasharray="10 8"/>
<circle cx="480.0" cy="156.0" r="7" fill="#0E6481" stroke="#FFFFFF" stroke-width="2"/>
<circle cx="480.0" cy="360.0" r="7" fill="#0E6481" stroke="#FFFFFF" stroke-width="2"/>
<text x="501" y="285" font-family="DejaVu Sans,sans-serif" font-size="34" font-weight="800" fill="#064E68">h</text>
<!-- Etiquetas fuera del cuerpo para no tapar las relaciones geométricas. -->
<rect x="656" y="119" width="249" height="63" rx="12" fill="#FFFFFF" stroke="#9BBCC2" stroke-width="2"/>
<text x="673" y="160" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#15495C">Base superior</text>
<path d="M650 169 L602.1,144.4" fill="none" stroke="#15495C" stroke-width="2.5"/>
<rect x="45" y="402" width="235" height="65" rx="12" fill="#FFFFFF" stroke="#9BBCC2" stroke-width="2"/>
<text x="62" y="444" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#15495C">Base inferior</text>
<path d="M280 430 L221.0,384.5" fill="none" stroke="#15495C" stroke-width="2.5"/>
<rect x="52" y="525" width="856" height="52" rx="10" fill="#FFFFFF" opacity=".95"/>
<text x="72" y="556" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#254A59">6 caras · 12 aristas · 8 vértices · altura perpendicular entre bases</text>
</svg>