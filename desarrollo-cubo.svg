<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Desarrollo plano del cubo para recortar</title><desc id="descripcion">Seis cuadrados de tres centímetros de lado, en forma de cruz. Recortar el contorno continuo y doblar las cinco uniones discontinuas. No hay pestañas de pegado.</desc><rect width="210" height="297" fill="white"/><text x="18" y="24" font-family="Arial,sans-serif" font-size="7" font-weight="700" fill="#173649">DEL PLANO AL CUBO</text><text x="18" y="35" font-family="Arial,sans-serif" font-size="4.5" fill="#344d5c">Plantilla recortable · Cada cuadrado mide 3 × 3 cm</text><text x="18" y="43" font-family="Arial,sans-serif" font-size="4.2" fill="#344d5c">Imprimir en A4 al 100 % · Desactivar «ajustar a página»</text><text x="18" y="51" font-family="Arial,sans-serif" font-size="4" fill="#344d5c">Línea continua: recortar · Línea discontinua: doblar</text>
