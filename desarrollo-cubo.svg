<text x="18" y="242" font-family="Arial,sans-serif" font-size="4.1" fill="#344d5c">1. Recorta por el contorno continuo.</text><text x="18" y="249" font-family="Arial,sans-serif" font-size="4.1" fill="#344d5c">2. Dobla por las cinco uniones discontinuas.</text><text x="18" y="256" font-family="Arial,sans-serif" font-size="4.1" fill="#344d5c">3. Une las caras con cinta de papel.</text><text x="18" y="265" font-family="Arial,sans-serif" font-size="3.8" fill="#344d5c">Sin pestañas. Usa tijeras con ayuda adulta cuando sea necesario.</text><text x="18" y="280" font-family="Arial,sans-serif" font-size="3.5" fill="#667c84">Imprime al 100 % y comprueba la línea de control antes de recortar.</text></svg>
